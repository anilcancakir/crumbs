# crumbs install manifest (PluginInstaller DSL schema v1).
#
# Crumbs is a passive observability plugin. Install registers
# CrumbsDowelProvider into the consumer's lib/app/_plugins.g.dart codegen
# barrel (via the dowel manifest installer's _registerDowelProvider step)
# so the crumbs CLI commands and crumbs_* MCP tools surface through the
# consumer's `./bin/dowel` fast-cli and `dart run dowel:mcp` outputs.
#
# No stub files are published: crumbs captures via runtime hooks, not
# scaffolded code. `crumbs:install` wires the runtime install into
# lib/main.dart; without it the consumer wires it by hand (see the
# post_install message).
#
# See doc/install_yaml_schema.md (in dowel) for the full schema.

plugin_name: crumbs

publish: {}

magic:
  provider: null   # crumbs is dowel-only; no magic provider class to inject.

post_install:
  message: |
    crumbs plugin:installed. Bootstrap workflow:

    1. In your consumer's lib/main.dart, gated under `if (!kReleaseMode)`:

         CrumbsPlugin.install();                       // before runApp() (or before Magic.init() for the Magic stack)
         CrumbsPlugin.registerWatcher(ExceptionWatcher());
         CrumbsPlugin.registerWatcher(DumpWatcher());

    2. Magic apps: MagicCrumbsIntegration.install() goes AFTER
       Magic.init(), under the same guard. It lives in
       package:magic_devtools/crumbs.dart, so it is only available when
       the magic_devtools you resolve ships lib/crumbs.dart; older
       releases ship lib/telescope.dart instead. `crumbs:install` wires
       it only in that case and otherwise prints a warning; upgrade
       magic_devtools and rerun `dart run crumbs crumbs:install`.

    3. Verify the CLI (three equivalent entry points, fastest first):

         ./bin/dowel list                       # consumer fast-cli (native AOT, ~110ms warm)
         dart run dowel list     # consumer dispatcher fallback (~3s cold)
         dart run crumbs list   # crumbs's own bootstrap entry (~3s cold, useful pre-install)

       All three include the `crumbs:` namespace.

    4. Verify the MCP surface:

         dart run crumbs mcp:install   # add the dowel MCP server entry to .mcp.json
         # then run /mcp reconnect dowel; /mcp lists the crumbs_* tools.
