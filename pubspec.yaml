name: crumbs
description: "Inspect a running Flutter app from an AI agent or the CLI: HTTP traffic, logs, exceptions, queries and events captured in memory, read over MCP."
version: 1.0.0
homepage: https://anilcancakir.com/crumbs
repository: https://github.com/anilcancakir/crumbs
issue_tracker: https://github.com/anilcancakir/crumbs/issues

# pub.dev search topics: at most 5, existing topics only, ordered by priority.
# `flutter` adds nothing: pub.dev derives the sdk:flutter tag itself.
topics:
  - mcp
  - ai-agents
  - inspector
  - observability
  - debugging

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  dowel: ^1.0.0
  logging: ^1.2.0
  meta: ^1.16.0

executables:
  # `dart run crumbs <cmd>`: the dowel CLI with the crumbs commands and
  # MCP tools added through CrumbsDowelProvider.
  crumbs: crumbs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
