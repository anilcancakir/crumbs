name: Bug Report
description: Report a bug in crumbs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the details below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Call `CrumbsPlugin.install()` in a Flutter app
        2. Trigger the relevant watcher (e.g. make an HTTP request)
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include the full error message and stack trace if available.
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      description: Which part of the framework is affected?
      options:
        - Watchers (LogWatcher / ExceptionWatcher / DumpWatcher / Magic*)
        - Adapters (CrumbsStore.recordHttp / MagicHttpFacadeAdapter)
        - Records (HttpRequestRecord / LogRecordEntry / etc.)
        - Extension contracts (CrumbsWatcher / CrumbsHttpAdapter)
        - VM Service extensions (ext.crumbs.*)
        - MCP tools (crumbs_*)
        - CLI commands (crumbs:install / tail / requests / queries / caches / clear)
        - CrumbsStore (ring buffers / capacity / clear)
        - CrumbsPlugin (install / registerHttpAdapter / registerWatcher)
        - CrumbsFileSink (timeline files / crumbs:files)
        - CrumbsRedaction (credential masking / redactor)
        - install.yaml plugin manifest
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command Invocation
      description: The exact `dart run crumbs ...` command (or MCP tool name + arguments) that triggered the bug.
      placeholder: "dart run crumbs crumbs:tail --limit=50"
      render: shell

  - type: textarea
    id: code
    attributes:
      label: Minimal Reproduction Code
      description: A minimal code snippet that reproduces the issue.
      render: dart

  - type: input
    id: crumbs-version
    attributes:
      label: crumbs Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: dart-version
    attributes:
      label: Dart / Flutter Version
      description: Output of `dart --version` and `flutter --version`.
      placeholder: "Dart SDK version: 3.13.0 (stable) / Flutter 3.47.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
        - All
    validations:
      required: true
